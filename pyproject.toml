[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-stateful-cursor-paginator"
version = "0.1.0"
description = "Stateful cursor-based pagination engine for high-volume MCP resource queries with automatic memory reclamation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
mcp-stateful-cursor-paginator = "mcp_stateful_cursor_paginator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_stateful_cursor_paginator*"]
